name: "Build"
on:
  push:
  pull_request:
    branches:
      - 'master'
      - 'release**'
      - 'develop'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  docker-nodejs-base:
    uses: 8x8/analytics-build8-workflows/.github/workflows/complete_docker_image.yaml@v3.0
    with:
      version: "1.0"
      platform: "linux/amd64,linux/arm64"
      dockerfile: "./Dockerfile"
      docker_working_directory: "./"
      docker_image_name: "8x8/netshoot"
      release_regex: "^(master|release.*)$"
      publish_regex: "^(master|release.*|develop)$"
      tags: "1.0"
      use_full_version: 'true'